.add('hidden');$('portal').classList.remove('hidden');$('name').textContent=a.data.contact_name||a.data.email||'Client';$('company').textContent=a.data.company_name||'';const q=await s.from('client_quotes').select('*').eq('profile_id',user.id).order('quote_date',{ascending:false});$('quotes').innerHTML=table(q.data||[],'q');const i=await s.from('client_invoices').select('*').eq('profile_id',user.id).order('invoice_date',{ascending:false});$('invoices').innerHTML=table(i.data||[],'i')}$('signInTab').onclick=()=>mode(false);$('signUpTab').onclick=()=>mode(true);$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent=signup?'Creating account…':'Signing in…';const r=signup?await s.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{full_name:$('nameInput').value.trim(),role:'client'}}}):await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('status').textContent=r.error.message;return}if(signup&&!r.data.session){$('status').textContent='Account created. Check your email to confirm, then sign in.';mode(false);return}load()};$('logout').onclick=async()=>{await s.auth.signOut();load()};mode(false);load();</script></body></html>
