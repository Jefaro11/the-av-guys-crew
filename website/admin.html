<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The AV Guys — Website Admin</title><link rel="icon" href="../icon.svg"><link rel="stylesheet" href="styles.css"></head><body class="portal-shell"><div class="portal-wrap"><div class="portal-nav"><a class="brand" href="./"><img src="../icon.svg" alt=""><span>Website Admin</span></a><a href="./">← Website</a></div><div id="login" class="portal-card"><div class="eyebrow">ADMIN</div><h1 style="font-size:48px">Manage the website.</h1><p class="muted">Only active accounts in the website_admins table can use this page.</p><form id="loginForm" class="portal-form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary">Sign in</button><div id="loginStatus" class="form-status"></div></form></div><div id="admin" class="hidden"><div class="portal-card"><div class="portal-nav" style="margin:0"><div><div class="eyebrow">CONTROL CENTER</div><h2>Website content</h2></div><button id="logout" class="btn secondary">Sign out</button></div></div><div class="admin-grid"><section class="admin-card"><h3>Add gallery item</h3><form id="galleryForm" class="portal-form"><label>Title<input id="gt" required></label><label>Category<input id="gc" value="event"></label><label>Description<textarea id="gd" rows="3"></textarea></label><label>Photo<input id="gf" type="file" accept="image/*" required></label><label>Published<select id="gp"><option value="true">Yes</option><option value="false">No</option></select></label><button class="btn primary">Add photo</button></form></section><section class="admin-card"><h3>Add partner</h3><form id="partnerForm" class="portal-form"><label>Name<input id="pn" required></label><label>Description<textarea id="pd" rows="3"></textarea></label><label>Website<input id="pu" type="url"></label><label>Logo<input id="pf" type="file" accept="image/*"></label><label>Published<select id="pp"><option value="true">Yes</option><option value="false">No</option></select></label><button class="btn primary">Add partner</button></form></section></div><div class="portal-card"><h2>Gallery & Partners</h2><div id="mediaList" class="admin-list">Loading…</div></div><div class="portal-card"><h2>Quote requests</h2><div id="requests">Loading…</div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://aajeoloaenfewxololpj.supabase.co',K='sb_publishable_IwUHY90pADW53KoHEHvEt_A_ik7r8Vlq',s=supabase.createClient(U,K),$=i=>document.getElementById(i),esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function isAdmin(){const {data:{user}}=await s.auth.getUser();if(!user){$('login').classList.remove('hidden');$('admin').classList.add('hidden');return false}const r=await s.from('website_admins').select('user_id').eq('user_id',user.id).eq('active',true).maybeSingle();if(r.error||!r.data){$('loginStatus').textContent=r.error?.message||'This account is not an active website admin.';return false}$('login').classList.add('hidden');$('admin').classList.remove('hidden');loadAll();return true}async function upload(file,folder){const path=folder+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const r=await s.storage.from('website-media').upload(path,file,{upsert:false,contentType:file.type});if(r.error)throw r.error;return path}async function loadAll(){const [g,p,q]=await Promise.all([s.from('gallery_items').select('*').order('sort_order').order('created_at',{ascending:false}),s.from('partner_items').select('*').order('sort_order').order('created_at',{ascending:false}),s.from('quote_requests').select('*').order('created_at',{ascending:false}).limit(100)]);$('mediaList').innerHTML='<h4>Gallery</h4>'+((g.data?.length)?g.data.map(x=>'<div class="admin-item"><span>'+esc(x.title)+' <span class="tag">'+(x.published?'Published':'Hidden')+'</span></span><button class="btn danger" data-del-g="'+esc(x.id)+'">Delete</button></div>').join(''):'<div class="muted">No gallery items.</div>')+'<h4 style="margin-top:24px">Partners</h4>'+((p.data?.length)?p.data.map(x=>'<div class="admin-item"><span>'+esc(x.name)+' <span class="tag">'+(x.published?'Published':'Hidden')+'</span></span><button class="btn danger" data-del-p="'+esc(x.id)+'">Delete</button></div>').join(''):'<div class="muted">No partners.</div>');$('requests').innerHTML=q.error?esc(q.error.message):((q.data?.length)?'<table class="portal-table"><thead><tr><th>#</th><th>Contact</th><th>Event</th><th>Status</th><th></th></tr></thead><tbody>'+q.data.map(x=>'<tr><td>'+esc(x.request_number)+'</td><td><b>'+esc(x.contact_name)+'</b><br>'+esc(x.email)+'</td><td>'+esc(x.event_name||'')+'<br><span class="muted">'+esc(x.venue||'')+'</span></td><td><select data-status="'+esc(x.id)+'"><option'+(x.status==='new'?' selected':'')+'>new</option><option'+(x.status==='contacted'?' selected':'')+'>contacted</option><option'+(x.status==='quoted'?' selected':'')+'>quoted</option><option'+(x.status==='accepted'?' selected':'')+'>accepted</option><option'+(x.status==='declined'?' selected':'')+'>declined</option><option'+(x.status==='closed'?' selected':'')+'>closed</option></select></td><td>'+esc(x.created_at?.slice(0,10)||'')+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">No quote requests yet.</div>');document.querySelectorAll('[data-del-g]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete gallery item?'))return;const r=await s.from('gallery_items').delete().eq('id',b.dataset.delG);if(r.error)alert(r.error.message);else loadAll()});document.querySelectorAll('[data-del-p]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete partner?'))return;const r=await s.from('partner_items').delete().eq('id',b.dataset.delP);if(r.error)alert(r.error.message);else loadAll()});document.querySelectorAll('[data-status]').forEach(x=>x.onchange=async()=>{const r=await s.from('quote_requests').update({status:x.value,updated_at:new Date().toISOString()}).eq('id',x.dataset.status);if(r.error)alert(r.error.message)})}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginStatus').textContent='Signing in…';const r=await s.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('loginStatus').textContent=r.error.message;return}isAdmin()};\n$('resetBtn').onclick=async()=>{const email=$('email').value.trim();if(!email){$('loginStatus').textContent='Enter your email address first.';return}$('loginStatus').textContent='Sending password reset email…';const r=await s.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});if(r.error){$('loginStatus').textContent=r.error.message;return}$('loginStatus').textContent='Reset email sent. Check your inbox.';};\ns.auth.onAuthStateChange(async event=>{if(event==='PASSWORD_RECOVERY')$('recoveryBox').style.display='block';});\n$('savePassword').onclick=async()=>{const password=$('newPassword').value;if(password.length<8){$('loginStatus').textContent='Password must be at least 8 characters.';return}const r=await s.auth.updateUser({password});if(r.error){$('loginStatus').textContent=r.error.message;return}$('loginStatus').textContent='Password updated. Signing you in…';isAdmin();};$('logout').onclick=async()=>{await s.auth.signOut();isAdmin()};$('galleryForm').onsubmit=async e=>{e.preventDefault();try{const path=await upload($('gf').files[0],'gallery');const r=await s.from('gallery_items').insert({title:$('gt').value.trim(),category:$('gc').value.trim(),description:$('gd').value.trim()||null,image_path:path,published:$('gp').value==='true'});if(r.error)throw r.error;e.target.reset();alert('Gallery item added');loadAll()}catch(err){alert(err.message||String(err))}};$('partnerForm').onsubmit=async e=>{e.preventDefault();try{let path=null;if($('pf').files[0])path=await upload($('pf').files[0],'partners');const r=await s.from('partner_items').insert({name:$('pn').value.trim(),description:$('pd').value.trim()||null,website_url:$('pu').value.trim()||null,logo_path:path,published:$('pp').value==='true'});if(r.error)throw r.error;e.target.reset();alert('Partner added');loadAll()}catch(err){alert(err.message||String(err))}};isAdmin();</script></body></html>
