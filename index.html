<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AV Guys Crew"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><title>The AV Guys Crew</title></head>
<body><div class="wrap">
<header class="top"><div class="brand"><img src="icon.svg" alt="AV Guys"><div><strong>The AV Guys</strong><div class="tiny">Crew mobile</div></div></div><div class="top-actions"><button id="refresh" class="btn ghost">↻</button><button id="signOut" class="btn ghost">Sign out</button></div></header>
<div id="auth" class="auth"><div class="card"><img class="logo-big" src="icon.svg" alt="The AV Guys Crew"><div class="section-title">Crew portal</div><h1 id="authTitle">Crew access</h1><p class="muted" id="authSubtitle">Sign in to see your AV Guys events and crew calls.</p><div class="tabs"><button id="loginTab" class="btn tab active">Sign in</button><button id="signupTab" class="btn secondary tab">Create account</button></div><form id="authForm"><div id="nameWrap" class="field hidden"><label>Full name</label><input id="fullName" autocomplete="name" placeholder="Your name"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required><button id="togglePassword" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button></div></div><div class="actions"><button id="authSubmit" class="btn" type="submit">Sign in</button></div></form><div id="signupNote" style="margin-top:12px"></div></div></div>
<div id="app" class="hidden"><div class="card notice"><div class="event-head"><div><strong>Push notifications</strong><div id="pushHint" class="tiny" style="margin-top:4px">Enable notifications so you receive event confirmations and crew-plan changes.</div></div><button id="pushButton" class="btn secondary">Enable notifications</button></div></div><div id="main"></div><nav class="bottom"><div class="bottom-inner"><button id="tabEvents" class="btn tab active">My events</button><button id="tabGear" class="btn secondary tab">Gear</button><button id="tabAlerts" class="btn secondary tab">Alerts <span id="alertCount" class="hidden">0</span></button></div></nav></div>
<div id="loading" class="hidden"><div class="card" style="display:flex;align-items:center;gap:10px"><span class="spinner"></span><span id="loadingText">Loading…</span></div></div>
<div id="toast" class="hidden" style="position:fixed;left:16px;right:16px;bottom:80px;max-width:728px;margin:auto;padding:12px 14px;border-radius:14px;background:#0d2236;border:1px solid rgba(71,215,255,.25);color:#eef6ff;z-index:50"></div>
</div><script type="module" src="app.js"></script><script type="module" src="responses.js"></script><script type="module" src="gear.js"></script></body></html>
